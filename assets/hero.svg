<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="380" fill="none">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');
      
      .hero-eyebrow {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        fill: #C71585;
      }
      .hero-title-main {
        font-family: 'Playfair Display', 'Cinzel', 'Didot', Georgia, serif;
        font-size: 58px;
        font-weight: 800;
        letter-spacing: -0.01em;
        line-height: 1.05;
      }
      .hero-disciplines {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
        fill: #3A2630;
      }
      .hero-desc {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        fill: #8B6F7B;
        line-height: 1.5;
      }
      .hero-chip-text {
        font-family: 'JetBrains Mono', 'SF Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(1deg); }
      }
      @keyframes shimmerGleam {
        0%, 100% { opacity: 0.75; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      
      .float-shape {
        animation: floatSoft 6s ease-in-out infinite;
      }
      .gleam-sparkle {
        animation: shimmerGleam 4s ease-in-out infinite;
        transform-origin: center;
      }
    ]]></style>

    <linearGradient id="barbiePrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4F9A" />
      <stop offset="45%" stop-color="#E0218A" />
      <stop offset="100%" stop-color="#C71585" />
    </linearGradient>

    <linearGradient id="blushSurfaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF9FC" />
      <stop offset="100%" stop-color="#FFF0F6" />
    </linearGradient>

    <linearGradient id="accentRibbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0218A" />
      <stop offset="50%" stop-color="#FF4F9A" />
      <stop offset="85%" stop-color="#FFD1DC" />
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="geoCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FFD1DC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFF0F6" stop-opacity="0.1" />
    </linearGradient>

    <radialGradient id="heroAura" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFD6E7" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#FFF0F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFF9FC" stop-opacity="0" />
    </radialGradient>

    <filter id="editorialCardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#E0218A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="960" height="380" rx="20" fill="#FFF9FC" />
  <rect width="960" height="380" rx="20" fill="url(#heroAura)" />

  <rect x="14" y="14" width="932" height="352" rx="18" fill="url(#blushSurfaceGrad)" stroke="#FFD6E7" stroke-width="1.2" filter="url(#editorialCardShadow)" />

  <g stroke="#E0218A" stroke-width="0.7" stroke-opacity="0.09">
    <line x1="48" y1="14" x2="48" y2="366" />
    <line x1="912" y1="14" x2="912" y2="366" />
    <line x1="14" y1="52" x2="946" y2="52" />
    <line x1="14" y1="324" x2="946" y2="324" />
  </g>

  <g stroke="#E0218A" stroke-width="1.6" stroke-linecap="square" fill="none">
    <path d="M 28 38 L 28 26 L 40 26" />
    <path d="M 920 26 L 932 26 L 932 38" />
    <path d="M 28 342 L 28 354 L 40 354" />
    <path d="M 920 354 L 932 354 L 932 342" />
  </g>

  <g class="float-shape">
    <circle cx="780" cy="180" r="135" fill="url(#geoCircleGrad)" />
    <circle cx="780" cy="180" r="105" fill="none" stroke="#FFD1DC" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.8" />
    <circle cx="780" cy="180" r="70" fill="#FFFFFF" fill-opacity="0.65" stroke="#FFD6E7" stroke-width="1.2" />

    <path d="M 660 120 C 730 80, 810 130, 880 100 C 910 85, 930 95, 940 110"
          fill="none" stroke="url(#accentRibbonGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 680 250 C 740 280, 820 220, 890 260"
          fill="none" stroke="#E0218A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.4" />

    <g transform="translate(780, 180)">
      <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#E0218A" stroke-width="1.4" />
      <polygon points="0,-18 18,0 0,18 -18,0" fill="#FFF0F6" stroke="#FF4F9A" stroke-width="1" />
      <text x="0" y="7" text-anchor="middle" font-family="'Playfair Display', serif" font-size="20" font-weight="800" fill="#C71585" letter-spacing="0.05em">SP</text>
    </g>

    <circle cx="865" cy="115" r="3" fill="#00B4D8" opacity="0.9" />
  </g>

  <g transform="translate(56, 44)">
    <rect x="0" y="-12" width="6" height="18" fill="#E0218A" rx="2" />
    <text x="16" y="2" class="hero-eyebrow">SHAMBHAVI PATIL &#160;//&#160; SOFTWARE + AI ENGINEERING</text>
    <text x="590" y="2" class="hero-chip-text" fill="#8B6F7B" text-anchor="end">PICT PUNE &apos;28 &#160;·&#160; ATELIER 500</text>
  </g>

  <g transform="translate(56, 116)">
    <text x="0" y="0" class="hero-title-main" fill="url(#barbiePrimaryGrad)">SHAMBHAVI</text>
    <text x="0" y="58" class="hero-title-main" fill="#3A2630">PATIL</text>
  </g>

  <path d="M 56 200 L 460 200" stroke="url(#accentRibbonGrad)" stroke-width="2.5" stroke-linecap="round" />

  <g transform="translate(56, 226)">
    <text x="0" y="0" class="hero-disciplines">AI / ML &#160;·&#160; SOFTWARE ENGINEERING &#160;·&#160; INTELLIGENT SYSTEMS</text>
  </g>

  <g transform="translate(56, 256)">
    <text x="0" y="0" class="hero-desc">Third-year Electronics &amp; Telecommunication Engineering student at PICT Pune</text>
    <text x="0" y="22" class="hero-desc">building practical software and AI systems with real-world applications.</text>
  </g>

  <g transform="translate(56, 332)">
    <g transform="translate(0, -16)">
      <rect x="0" y="0" width="168" height="24" rx="6" fill="#FFF0F6" stroke="#FFD6E7" stroke-width="1" />
      <circle cx="10" cy="12" r="3" fill="#E0218A" />
      <text x="18" y="15.5" class="hero-chip-text" fill="#C71585">PICT ENTC · CGPA 8.6</text>
    </g>

    <g transform="translate(176, -16)">
      <rect x="0" y="0" width="220" height="24" rx="6" fill="#FFF0F6" stroke="#FFD6E7" stroke-width="1" />
      <circle cx="10" cy="12" r="3" fill="#FF4F9A" />
      <text x="18" y="15.5" class="hero-chip-text" fill="#3A2630">MINDSTRIX · AI/ML R&amp;D INTERN</text>
    </g>

    <g transform="translate(404, -16)">
      <rect x="0" y="0" width="168" height="24" rx="6" fill="#FFF0F6" stroke="#FFD6E7" stroke-width="1" />
      <circle cx="10" cy="12" r="3" fill="#C71585" />
      <text x="18" y="15.5" class="hero-chip-text" fill="#C71585">TECHFIESTA &apos;26 WINNER</text>
    </g>
  </g>

  <g class="gleam-sparkle" style="transform-origin: 510px 110px;">
    <path d="M 510 102 Q 512 107 516 110 Q 512 113 510 118 Q 508 113 504 110 Q 508 107 510 102 Z" fill="#E0218A" />
    <circle cx="510" cy="110" r="1.5" fill="#FFFFFF" />
  </g>
  <g class="gleam-sparkle" style="transform-origin: 915px 70px;">
    <path d="M 915 63 Q 917 67 920 70 Q 917 73 915 77 Q 913 73 910 70 Q 913 67 915 63 Z" fill="#FF4F9A" />
    <circle cx="915" cy="70" r="1.2" fill="#FFFFFF" />
  </g>
</svg>