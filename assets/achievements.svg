    <!-- Sparkles -->
    
    <g class="sparkle-anim" style="transform-origin: 904px 36px;">
      <path d="
        M 904 31
        Q 906 34 909 36
        Q 906 38 904 41
        Q 902 38 899 36
        Q 902 34 904 31
        Z"
        fill="#FFFFFF"
        opacity="0.9"
      />
      <circle cx="904" cy="36" r="1.5" fill="#FFFFFF" />
    </g>
  
    
    <g class="sparkle-anim" style="transform-origin: 470px 40px;">
      <path d="
        M 470 35
        Q 472 38 475 40
        Q 472 42 470 45
        Q 468 42 465 40
        Q 468 38 470 35
        Z"
        fill="#FF85C0"
        opacity="0.9"
      />
      <circle cx="470" cy="40" r="1.5" fill="#FFFFFF" />
    </g>
  
    
    <g class="sparkle-anim" style="transform-origin: 880px 265px;">
      <path d="
        M 880 259.5
        Q 882.2 262.8 885.5 265
        Q 882.2 267.2 880 270.5
        Q 877.8 267.2 874.5 265
