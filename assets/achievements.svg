          </text>
        </g>

        <!-- Metric Footer -->
        <g transform="translate(14, 162)">
          <text x="0" y="0" class="code-mono" font-size="8.5" font-weight="600" fill="#00E676">
            &#10003; Social &amp; Earth Impact
          </text>
        </g>
      </g>
    
      <!-- Achievement Card 3: FINTECH ALGO ENGINEER -->
      <g transform="translate(474, 74)">
        <!-- Card Base -->
        <rect x="0" y="0" width="200" height="180" rx="12"
