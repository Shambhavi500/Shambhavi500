<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="100%" height="310" fill="none">
    
    <defs>
      <!-- Embedded Styles in XML CDATA -->
      <style type="text/css"><![CDATA[
        .editorial-title {
          font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Playfair Display', Georgia, serif;
          font-weight: 700;
          letter-spacing: 0.12em;
        }
        .editorial-script {
          font-family: 'Playfair Display', 'Didot', Georgia, serif;
          font-style: italic;
        }
        .editorial-sans {
          font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .code-mono {
          font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
        }
        
        /* Subtle Shimmer & Pulse Keyframes */
        @keyframes shimmerPulse {
          0% { stop-color: #E0218A; stop-opacity: 0.85; }
          50% { stop-color: #FF2D87; stop-opacity: 1; }
          100% { stop-color: #E0218A; stop-opacity: 0.85; }
        }
        @keyframes sparkleGlint {
          0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.7; }
          50% { transform: scale(1.15) rotate(15deg); opacity: 1; }
        }
        @keyframes runwayGlow {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; filter: drop-shadow(0 0 6px #FF2D87); }
        }
        
        .sparkle-anim {
          animation: sparkleGlint 4s ease-in-out infinite;
          transform-origin: center;
        }
        .runway-glow {
          animation: runwayGlow 3s ease-in-out infinite;
        }
      ]]></style>

      <!-- Barbie Chrome Metallic Gradient -->
      <linearGradient id="dash_chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="25%" stop-color="#FFD6E8" />
        <stop offset="50%" stop-color="#FFFFFF" />
        <stop offset="75%" stop-color="#E2E8F0" />
        <stop offset="100%" stop-color="#FFA8D3" />
      </linearGradient>

      <!-- Signature Barbie Dreamhouse Pink Gradient -->
      <linearGradient id="dash_barbieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#D4145A" />
        <stop offset="50%" stop-color="#E0218A" />
        <stop offset="100%" stop-color="#FF2D87" />
      </linearGradient>

      <!-- Satin Rose Glow Gradient -->
      <linearGradient id="dash_roseSatin" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF2D87" stop-opacity="0.3" />
        <stop offset="50%" stop-color="#7928CA" stop-opacity="0.1" />
        <stop offset="100%" stop-color="#151122" stop-opacity="0.8" />
      </linearGradient>

      <!-- Glassmorphic Card Fill -->
      <linearGradient id="dash_cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1B162B" stop-opacity="0.92" />
        <stop offset="100%" stop-color="#100D1C" stop-opacity="0.96" />
      </linearGradient>

      <!-- Subtle Accent Border Gradient -->
      <linearGradient id="dash_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF2D87" stop-opacity="0.7" />
        <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.4" />
        <stop offset="70%" stop-color="#E0218A" stop-opacity="0.2" />
        <stop offset="100%" stop-color="#A6195D" stop-opacity="0.5" />
      </linearGradient>

      <!-- Soft Radial Dreamhouse Glow -->
      <radialGradient id="dash_radialAura" cx="50%" cy="0%" r="70%">
        <stop offset="0%" stop-color="#FF2D87" stop-opacity="0.22" />
        <stop offset="60%" stop-color="#E0218A" stop-opacity="0.06" />
        <stop offset="100%" stop-color="#0D0B14" stop-opacity="0" />
      </radialGradient>

      <!-- Star / Sparkle Filter -->
      <filter id="dash_glowFilter" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  
    
    <!-- Outer Studio Glass Base -->
    <rect width="940" height="310" rx="16" fill="#0D0B14" />
    <rect width="940" height="310" rx="16" fill="url(#dash_radialAura)" />

    <!-- Outer Frame -->
    <rect x="16" y="16" width="908" height="278" rx="14"
          fill="url(#dash_cardGlass)" stroke="url(#dash_borderGrad)" stroke-width="1" />

    <!-- Dashboard Header Line -->
    <g transform="translate(42, 38)">
      <text x="0" y="0" class="code-mono" font-size="10" font-weight="600" fill="#FF85C0" letter-spacing="0.14em">
        DREAMHOUSE DASHBOARD // TELEMETRY &amp; GITHUB METRICS
      </text>
    </g>
    <g transform="translate(898, 38)">
      <text x="0" y="0" text-anchor="end" class="code-mono" font-size="9" fill="#9D93A8" letter-spacing="0.12em">
        REAL-TIME REPOSITORY TELEMETRY
      </text>
    </g>

    <!-- 4 High-Fashion Statistic Pods in Grid -->
    <!-- Card 1: Public Repositories -->
    <g transform="translate(42, 60)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#130F1E" stroke="rgba(224, 33, 138, 0.3)" stroke-width="0.9" />
      <text x="16" y="24" class="code-mono" font-size="9" font-weight="600" fill="#FF85C0" letter-spacing="0.12em">
        PUBLIC REPOSITORIES
      </text>
      <text x="16" y="72" class="editorial-title" font-size="42" fill="url(#dash_chromeGrad)">
        14
      </text>
      <text x="16" y="98" class="code-mono" font-size="9" fill="#9D93A8">
        100% Original Open Source
      </text>
      <circle cx="176" cy="22" r="3.5" fill="#FF2D87" />
    </g>

    <!-- Card 2: Polyglot Architecture -->
    <g transform="translate(260, 60)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#130F1E" stroke="rgba(224, 33, 138, 0.3)" stroke-width="0.9" />
      <text x="16" y="24" class="code-mono" font-size="9" font-weight="600" fill="#FF85C0" letter-spacing="0.12em">
        PRIMARY STACK
      </text>
      <text x="16" y="66" class="editorial-sans" font-size="20" font-weight="700" fill="#FFFFFF">
        Py &amp; TS
      </text>
      <text x="16" y="86" class="code-mono" font-size="10" fill="#FF85C0">
        4 Python · 4 TypeScript
      </text>
      <text x="16" y="104" class="code-mono" font-size="9" fill="#9D93A8">
        + JS (3) · Kotlin (1)
      </text>
    </g>

    <!-- Card 3: Domain Specializations -->
    <g transform="translate(478, 60)">
      <rect x="0" y="0" width="200" height="120" rx="10" fill="#130F1E" stroke="rgba(224, 33, 138, 0.3)" stroke-width="0.9" />
      <text x="16" y="24" class="code-mono" font-size="9" font-weight="600" fill="#FF85C0" letter-spacing="0.12em">
        CORE SPECIALTIES
      </text>
      <text x="16" y="68" class="editorial-title" font-size="38" fill="url(#dash_chromeGrad)">
        03
      </text>
      <text x="16" y="92" class="code-mono" font-size="9" fill="#E2D9E8">
        AI Agents · AgriTech
      </text>
      <text x="16" y="106" class="code-mono" font-size="9" fill="#FF85C0">
        · Algo FinTech
      </text>
    </g>

    <!-- Card 4: Engineering Discipline -->
    <g transform="translate(696, 60)">
      <rect x="0" y="0" width="202" height="120" rx="10" fill="#130F1E" stroke="rgba(224, 33, 138, 0.3)" stroke-width="0.9" />
      <text x="16" y="24" class="code-mono" font-size="9" font-weight="600" fill="#FF85C0" letter-spacing="0.12em">
        DISCIPLINE / CADENCE
      </text>
      <text x="16" y="68" class="editorial-title" font-size="28" fill="url(#dash_chromeGrad)">
        ENTC
      </text>
      <text x="16" y="90" class="code-mono" font-size="9" fill="#E2D9E8">
        Systems &amp; Telecomm
      </text>
      <text x="16" y="106" class="code-mono" font-size="9" fill="#00E676">
        ● Active Builder
      </text>
    </g>

    <!-- Lower Panel: Language Proportion Haute Bar -->
    <g transform="translate(42, 200)">
      <rect x="0" y="0" width="856" height="74" rx="10" fill="#130F1E" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8" />
      
      <text x="18" y="24" class="code-mono" font-size="9.5" font-weight="600" fill="#FF85C0" letter-spacing="0.12em">
        LANGUAGE SPECTRUM // VERIFIED ARCHITECTURE
      </text>
      <text x="838" y="24" text-anchor="end" class="code-mono" font-size="9" fill="#9D93A8">
        DETERMINISTIC ANALYSIS
      </text>

      <!-- Multi-segment Luxury Progress Bar -->
      <g transform="translate(18, 34)">
        <!-- Bar background -->
        <rect x="0" y="0" width="820" height="8" rx="4" fill="rgba(255, 255, 255, 0.05)" />
        
        <!-- Segment 1: Python (33%) -->
        <rect x="0" y="0" width="270" height="8" rx="4" fill="#FF2D87" />
        <!-- Segment 2: TypeScript (33%) -->
        <rect x="274" y="0" width="270" height="8" rx="4" fill="#E0218A" />
        <!-- Segment 3: JavaScript (23%) -->
        <rect x="548" y="0" width="180" height="8" rx="4" fill="#FFA8D3" />
        <!-- Segment 4: Kotlin (11%) -->
        <rect x="732" y="0" width="88" height="8" rx="4" fill="#7928CA" />
      </g>

      <!-- Legend row -->
      <g transform="translate(18, 60)">
        <circle cx="5" cy="-4" r="3.5" fill="#FF2D87" />
        <text x="14" y="0" class="code-mono" font-size="9" fill="#E2D9E8">Python (33.3%)</text>

        <circle cx="155" cy="-4" r="3.5" fill="#E0218A" />
        <text x="164" y="0" class="code-mono" font-size="9" fill="#E2D9E8">TypeScript (33.3%)</text>

        <circle cx="320" cy="-4" r="3.5" fill="#FFA8D3" />
        <text x="329" y="0" class="code-mono" font-size="9" fill="#E2D9E8">JavaScript (25.0%)</text>

        <circle cx="485" cy="-4" r="3.5" fill="#7928CA" />
        <text x="494" y="0" class="code-mono" font-size="9" fill="#E2D9E8">Kotlin (8.4%)</text>

        <text x="820" y="0" text-anchor="end" class="code-mono" font-size="9" fill="#FF85C0">
          Polyglot Atelier
        </text>
      </g>
    </g>

    <!-- Sparkles -->
    
    <g class="sparkle-anim" style="transform-origin: 250px 48px;">
      <path d="
        M 250 42
        Q 252.4 45.6 256 48
        Q 252.4 50.4 250 54
        Q 247.6 50.4 244 48
        Q 247.6 45.6 250 42
        Z"
        fill="#FFFFFF"
        opacity="0.9"
      />
      <circle cx="250" cy="48" r="1.7999999999999998" fill="#FFFFFF" />
    </g>
  
    
    <g class="sparkle-anim" style="transform-origin: 890px 195px;">
      <path d="
        M 890 188
        Q 892.8 192.2 897 195
        Q 892.8 197.8 890 202
        Q 887.2 197.8 883 195
        Q 887.2 192.2 890 188
        Z"
        fill="#FF85C0"
        opacity="0.9"
      />
      <circle cx="890" cy="195" r="2.1" fill="#FFFFFF" />
    </g>
  
  </svg>