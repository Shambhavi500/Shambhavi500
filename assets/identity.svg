        </text>
        <text x="20" y="55" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          Algorithms. Although my academic background is in ENTC, I’ve been actively
        </text>
        <text x="20" y="70.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          exploring the software and AI space through projects, hackathons, research, and
        </text>
        <text x="20" y="86" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          hands-on learning.
        </text>
        <text x="20" y="111.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          I enjoy building practical solutions that use technology to solve real-world
        </text>
        <text x="20" y="127" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          problems. My work has included AI-driven agricultural systems, computer vision,
        </text>
        <text x="20" y="142.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          mobile applications, and cybersecurity-focused projects. I’ve worked with
        </text>
        <text x="20" y="158" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          technologies such as C++, Python, Java, JavaScript, Git/GitHub, Android, and
        </text>
        <text x="20" y="173.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          machine learning tools, while continuously improving my problem-solving and DSA
        </text>
        <text x="20" y="189" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          skills.
        </text>
        <text x="20" y="214.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          Hackathons have been an important part of my learning journey. I was part of the
        </text>
        <text x="20" y="230" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          winning team at TechFiesta 2026 in the Agriculture domain and also secured
        </text>
        <text x="20" y="245.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          Runner-Up at the Pune Agri International Hackathon, where our AI-powered
        </text>
        <text x="20" y="261" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          agricultural governance solution was presented to senior government officials.
        </text>
        <text x="20" y="276.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          These experiences have taught me how to work in a team, build under deadlines,
        </text>
        <text x="20" y="292" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          take an idea from a problem statement to a working prototype, and improve it
        </text>
        <text x="20" y="307.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          through testing and feedback.
        </text>
        <text x="20" y="333" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          I believe the best way to learn engineering is by building, experimenting,
        </text>
        <text x="20" y="348.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          debugging, and improving real systems rather than only studying theory. Currently,
        </text>
        <text x="20" y="364" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          I’m focused on strengthening my software, AI/ML and DSA fundamentals, gaining
        </text>
        <text x="20" y="379.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          industry experience through internships, and building technically strong projects
        </text>
        <text x="20" y="395" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          that have real-world impact. In the long term, I want to build a strong career in
        </text>
        <text x="20" y="410.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          technology and continue growing as an engineer.
        </text>
