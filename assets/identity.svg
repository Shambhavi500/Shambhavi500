      </text>
    </g>

    <!-- Header Divider Line -->
    <line x1="42" y1="52" x2="898" y2="52" stroke="rgba(224, 33, 138, 0.16)" stroke-width="1" />

    <!-- Left Column: Editorial Builder Card -->
    <g transform="translate(42, 68)">
      <!-- Outer Frame -->
      <rect x="0" y="0" width="245" height="544" rx="16" fill="#FFEBF3" stroke="rgba(224, 33, 138, 0.35)" stroke-width="0.8" />

      <!-- Inner White Portrait Bezel -->
      <rect x="12" y="12" width="221" height="186" rx="12" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.16)" stroke-width="0.8" />

      <!-- Monogram Art with Barbie Pink Accent Circle -->
