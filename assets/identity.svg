<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="100%" height="310" fill="none">
    
    <defs>
      <!-- Embedded Styles in XML CDATA -->
      <style type="text/css"><![CDATA[
        .display-title {
          font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 800;
          letter-spacing: -0.02em;
        }
        .editorial-title {
          font-family: 'Cinzel', 'Playfair Display', 'Didot', Georgia, serif;
          font-weight: 700;
          letter-spacing: 0.08em;
        }
        .editorial-script {
          font-family: 'Playfair Display', 'Dancing Script', 'Brush Script MT', Georgia, cursive;
          font-style: italic;
          letter-spacing: 0.02em;
        }
        .editorial-sans {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-weight: 500;
        }
        .code-mono {
          font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
        }
        
        /* Subtle Shimmer & Pulse Keyframes */
        @keyframes subtlePulse {
          0%, 100% { opacity: 0.85; }
          50% { opacity: 1; }
        }
        @keyframes glint {
          0%, 100% { transform: scale(0.95); opacity: 0.7; }
          50% { transform: scale(1.08); opacity: 1; }
        }
        
        .pulse-anim {
          animation: subtlePulse 3s ease-in-out infinite;
        }
        .glint-anim {
          animation: glint 3.5s ease-in-out infinite;
          transform-origin: center;
        }
      ]]></style>

      <!-- Signature Barbie Gradient (Hot Pink to Barbie Pink to Magenta) -->
      <linearGradient id="ident_barbieGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FF2D87" />
        <stop offset="50%" stop-color="#E0218A" />
        <stop offset="100%" stop-color="#C2185B" />
      </linearGradient>

      <!-- Card Glass Backdrop Gradient -->
      <linearGradient id="ident_cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#151122" stop-opacity="0.94" />
        <stop offset="100%" stop-color="#0E0B16" stop-opacity="0.97" />
      </linearGradient>

      <!-- Rose Satin Monogram Gradient -->
      <linearGradient id="ident_roseSatin" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2D1124" />
        <stop offset="100%" stop-color="#1A0D18" />
      </linearGradient>

      <!-- Light Rose Ambient Surface Gradient -->
      <linearGradient id="ident_lightSurfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#FFF5F8" />
      </linearGradient>

      <!-- Delicate Pink Hairline Gradient -->
      <linearGradient id="ident_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF2D87" stop-opacity="0.45" />
        <stop offset="40%" stop-color="#FF85C0" stop-opacity="0.20" />
        <stop offset="70%" stop-color="#CBD5E1" stop-opacity="0.30" />
        <stop offset="100%" stop-color="#E0218A" stop-opacity="0.35" />
      </linearGradient>

      <!-- Platinum / Chrome Luxury Accent Gradient -->
      <linearGradient id="ident_chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="35%" stop-color="#F1F5F9" />
        <stop offset="70%" stop-color="#CBD5E1" />
        <stop offset="100%" stop-color="#E2E8F0" />
      </linearGradient>

      <!-- Winner Gold Accent Gradient -->
      <linearGradient id="ident_goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE68A" />
        <stop offset="50%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#D97706" />
      </linearGradient>

      <!-- Soft Ambient Radial Aura (Haute Dark Mode) -->
      <radialGradient id="ident_radialAura" cx="80%" cy="10%" r="70%">
        <stop offset="0%" stop-color="#E0218A" stop-opacity="0.14" />
        <stop offset="40%" stop-color="#FF2D87" stop-opacity="0.06" />
        <stop offset="100%" stop-color="#0D0B14" stop-opacity="0" />
      </radialGradient>

      <!-- Card Soft Shadow Filter -->
      <filter id="ident_cardShadow" x="-5%" y="-5%" width="110%" height="115%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E0218A" flood-opacity="0.06" />
      </filter>

      <!-- Subtle Plaque Glow Filter -->
      <filter id="ident_pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <filter id="ident_glowFilter" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  
    
    <!-- Light Studio Canvas Base -->
    <rect width="940" height="310" rx="16" fill="#FAFAFC" />
    
    <!-- Outer Card with Soft Shadow -->
    <rect x="16" y="16" width="908" height="278" rx="14"
          fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.18)" stroke-width="1" filter="url(#ident_cardShadow)" />

    <!-- Section Header Tag -->
    <g transform="translate(42, 40)">
      <text x="0" y="0" class="code-mono" font-size="10.5" font-weight="700" fill="#E0218A" letter-spacing="0.14em">
        THE PERSON // ENGINEERING PROFILE &amp; FOCUS
      </text>
    </g>
    <g transform="translate(898, 40)">
      <text x="0" y="0" text-anchor="end" class="code-mono" font-size="9" fill="#7A7A8E" letter-spacing="0.12em">
        ATELIER NO. 500 · PUNE, INDIA
      </text>
    </g>

    <!-- Header Divider Line -->
    <line x1="42" y1="52" x2="898" y2="52" stroke="rgba(17, 17, 22, 0.08)" stroke-width="1" />

    <!-- Left Column: Editorial Builder Card -->
    <g transform="translate(42, 68)">
      <!-- Outer Frame -->
      <rect x="0" y="0" width="245" height="206" rx="10" fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.18)" stroke-width="0.8" />
      
      <!-- Inner White Portrait Bezel -->
      <rect x="12" y="12" width="221" height="126" rx="8" fill="#FFFFFF" stroke="rgba(17, 17, 22, 0.08)" stroke-width="0.8" />
      
      <!-- Monogram Art with Barbie Pink Accent Circle -->
      <circle cx="122.5" cy="62" r="34" fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.28)" stroke-width="1.5" />
      <text x="122.5" y="70" text-anchor="middle" class="editorial-title" font-size="22" font-weight="800" fill="#111116">
        SP
      </text>
      
      <!-- Verification Badge Pill -->
      <rect x="36" y="108" width="173" height="20" rx="10" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.28)" stroke-width="0.8" />
      <circle cx="48" cy="118" r="3" fill="#00E676" />
      <text x="58" y="121.5" class="code-mono" font-size="8.5" font-weight="700" fill="#111116" letter-spacing="0.06em">
        VERIFIED BUILDER · CGPA 8.6
      </text>

      <!-- Identity Meta beneath portrait -->
      <text x="122.5" y="164" text-anchor="middle" class="editorial-sans" font-size="14" font-weight="800" fill="#111116">
        Shambhavi Patil
      </text>
      <text x="122.5" y="184" text-anchor="middle" class="code-mono" font-size="9" font-weight="600" fill="#E0218A" letter-spacing="0.06em">
        @Shambhavi500 · B.Tech ENTC
      </text>
    </g>

    <!-- Right Column: Editorial Bio & 3 Engineering Pillars -->
    <g transform="translate(315, 68)">
      <!-- Statement Heading -->
      <text x="0" y="18" class="display-title" font-size="18" font-weight="800" fill="#111116">
        ARCHITECTING IMPACT THROUGH CODE &amp; SILICON
      </text>
      
      <!-- Bio Quote Card with Pink Hairline Accent -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="583" height="56" rx="8" fill="#FFF5F8" stroke="rgba(224, 33, 138, 0.18)" stroke-width="0.8" />
        <line x1="0" y1="0" x2="0" y2="56" stroke="url(#ident_barbieGrad)" stroke-width="4" />
        <text x="16" y="24" class="editorial-sans" font-size="11.5" fill="#4A4A58" font-style="italic">
          &quot;ENTC undergraduate | Curious about technology, systems, and their real-world impact | Learning by building projects&quot;
        </text>
        <text x="16" y="44" class="code-mono" font-size="9" fill="#E0218A" font-weight="700" letter-spacing="0.06em">
          // PUNE INSTITUTE OF COMPUTER TECHNOLOGY (PICT) · B.TECH ENTC
        </text>
      </g>

      <!-- 3 Strategic Pillars of Shambhavi's Work -->
      <g transform="translate(0, 106)">
        <!-- Pillar 1: Autonomous AI -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="186" height="92" rx="8" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.18)" stroke-width="0.8" />
          <text x="14" y="22" class="code-mono" font-size="8.5" font-weight="700" fill="#E0218A" letter-spacing="0.1em">
            01 / AGENTIC AI
          </text>
          <text x="14" y="42" class="editorial-sans" font-size="12" font-weight="700" fill="#111116">
            Autonomous Systems
          </text>
          <text x="14" y="60" class="editorial-sans" font-size="9.5" fill="#4A4A58">
            Multi-agent workflows &amp;
          </text>
          <text x="14" y="74" class="editorial-sans" font-size="9.5" fill="#7A7A8E">
            intelligent automation (Ovio)
          </text>
        </g>

        <!-- Pillar 2: AgriTech -->
        <g transform="translate(198, 0)">
          <rect x="0" y="0" width="186" height="92" rx="8" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.18)" stroke-width="0.8" />
          <text x="14" y="22" class="code-mono" font-size="8.5" font-weight="700" fill="#E0218A" letter-spacing="0.1em">
            02 / EARTH &amp; AGRI
          </text>
          <text x="14" y="42" class="editorial-sans" font-size="12" font-weight="700" fill="#111116">
            Precision AgriTech
          </text>
          <text x="14" y="60" class="editorial-sans" font-size="9.5" fill="#4A4A58">
            Satellite spectral analysis &amp;
          </text>
          <text x="14" y="74" class="editorial-sans" font-size="9.5" fill="#7A7A8E">
            AI advisory (KrishiSahAI)
          </text>
        </g>

        <!-- Pillar 3: FinTech & RL -->
        <g transform="translate(396, 0)">
          <rect x="0" y="0" width="186" height="92" rx="8" fill="#FFFFFF" stroke="rgba(224, 33, 138, 0.18)" stroke-width="0.8" />
          <text x="14" y="22" class="code-mono" font-size="8.5" font-weight="700" fill="#E0218A" letter-spacing="0.1em">
            03 / QUANT &amp; FINTECH
          </text>
          <text x="14" y="42" class="editorial-sans" font-size="12" font-weight="700" fill="#111116">
            Autonomous FinTech
          </text>
          <text x="14" y="60" class="editorial-sans" font-size="9.5" fill="#4A4A58">
            Reinforcement learning &amp;
          </text>
          <text x="14" y="74" class="editorial-sans" font-size="9.5" fill="#7A7A8E">
            revenue recovery OS (AIRA)
          </text>
        </g>
      </g>
    </g>

    <!-- Restrained Luxury Glint Sparkles -->
    
    <g class="glint-anim" style="transform-origin: 895px 65px;">
      <path d="
        M 895 59
        Q 897.64 62.36 901 65
        Q 897.64 67.64 895 71
        Q 892.36 67.64 889 65
        Q 892.36 62.36 895 59
        Z"
        fill="#FF2D87"
        opacity="0.85"
      />
      <circle cx="895" cy="65" r="1.6800000000000002" fill="#FFFFFF" />
    </g>
  
    
    <g class="glint-anim" style="transform-origin: 278px 260px;">
      <path d="
        M 278 255.5
        Q 279.98 258.02 282.5 260
        Q 279.98 261.98 278 264.5
        Q 276.02 261.98 273.5 260
        Q 276.02 258.02 278 255.5
        Z"
        fill="#FF85C0"
        opacity="0.85"
      />
      <circle cx="278" cy="260" r="1.2600000000000002" fill="#FFFFFF" />
    </g>
  
  </svg>