        <!-- Render All 4 Paragraphs -->
        
        <text x="20" y="24" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
          I’m a third-year Electronics and Telecommunication Engineering student at PICT,
        </text>
        <text x="20" y="39.5" class="editorial-sans" font-size="10.8" fill="#2D2D2D" line-height="1.4">
