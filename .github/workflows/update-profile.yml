name: Update Barbie Haute Couture Profile

on:
  schedule:
    - cron: '0 0 * * 1' # Run every Monday at midnight UTC
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh GitHub Profile Data
        run: node scripts/fetch-github-data.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SVGs & README
        run: node scripts/generate.js

      - name: Run Automated Validation
        run: node scripts/validate.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md src/data/profile-data.json
          if git diff --staged --quiet; then
            echo "No profile changes detected."
          else
            git commit -m "chore(profile): refresh haute couture assets and metrics [skip ci]"
            git push
          fi
